[build]
  command = "NODE_ENV=production npm run production:check && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_DEMO_MODE = "true"
  DEPLOYMENT_PLATFORM = "netlify"

# Secrets and runtime flags must also be set in the Netlify UI (Functions scope).
# netlify.toml build variables are not runtime environment variables.
# Never run migrations, provisioning or development seeds in a build hook.
# Use Netlify's automatically maintained OpenNext adapter; no SPA redirects.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
# owner-order-email.mts declares its one-minute UTC schedule inline.
# It fails closed until all EMAIL_* readiness gates and production context are set.
