name: guteli-oracle
x-logging: &logging
  driver: local
  options: { max-size: '10m', max-file: '3' }
services:
  app:
    image: ${GUTELI_APP_IMAGE:?immutable app image required}
    pull_policy: never
    restart: unless-stopped
    user: '1001:1001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 2g
    cpus: 0.75
    logging: *logging
    env_file:
      - path: ${GUTELI_RUNTIME_ENV:?absolute private env path required}
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      TZ: America/Guatemala
      UPLOADS_ROOT: /app/uploads
      TRUSTED_PROXY_HOPS: '1'
      COMMERCIAL_ORDERS_ENABLED: 'false'
      PAYMENTS_ENABLED: 'false'
      WHATSAPP_NOTIFICATIONS_ENABLED: 'false'
      WHATSAPP_WEBHOOKS_ENABLED: 'false'
      REQUIRE_PERSISTENT_STORAGE: 'true'
    entrypoint: ['sh', '/app/infra/oracle/app-entrypoint.sh']
    command: ['node', 'server.js']
    volumes:
      - type: bind
        source: ${GUTELI_DATA_ROOT:?}/uploads
        target: /app/uploads
        bind: { create_host_path: false }
    tmpfs:
      [
        '/tmp:size=64m,mode=1777',
        '/app/.next/cache:uid=1001,gid=1001,size=128m',
      ]
    networks: [backend, edge]
    depends_on:
      database: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  database:
    image: ${GUTELI_POSTGRES_IMAGE:?postgres digest required}
    restart: unless-stopped
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 150
    mem_limit: 1536m
    cpus: 0.75
    logging: *logging
    environment:
      POSTGRES_USER: guteli
      POSTGRES_DB: guteli
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /data/postgres
      TZ: America/Guatemala
    secrets: [postgres_password]
    entrypoint: ['sh', '/etc/guteli/database-entrypoint.sh']
    command:
      [
        'postgres',
        '-c',
        'log_statement=none',
        '-c',
        'log_min_error_statement=panic',
        '-c',
        'log_error_verbosity=terse',
      ]
    volumes:
      - type: bind
        source: ${GUTELI_DATA_ROOT:?}
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: ./database-entrypoint.sh
        target: /etc/guteli/database-entrypoint.sh
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      [
        '/tmp:size=32m,mode=1777',
        '/var/run/postgresql:uid=999,gid=999,mode=0770,size=8m',
      ]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guteli -d guteli']
      interval: 10s
      timeout: 5s
      retries: 5
  proxy:
    image: ${GUTELI_CADDY_IMAGE:?caddy digest required}
    restart: unless-stopped
    user: '1001:1001'
    read_only: true
    cap_drop: [ALL]
    # Official Caddy binary has cap_net_bind_service=ep; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.25
    logging: *logging
    environment:
      GUTELI_HOSTNAME: ${GUTELI_HOSTNAME:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports: ['80:8080', '443:8443']
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${GUTELI_DATA_ROOT:?}/caddy
        target: /data
        bind: { create_host_path: false }
    tmpfs: ['/config:uid=1001,gid=1001,size=16m', '/tmp:size=16m']
    networks: [edge]
    depends_on:
      app: { condition: service_healthy }
secrets:
  postgres_password:
    file: ${GUTELI_POSTGRES_PASSWORD_FILE:?}
networks:
  backend: { internal: true }
  edge: {}
